    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 30px;
    color: #e6c13f;
    margin-bottom: 30px;
  }
  .sub {

    line-height: 1.45;

    position: absolute;
    right: 90px;
